# OvetimePolicies1 API + SQL Server
#
# Run from repo root (folder containing Dockerfile):
#   docker compose up --build
#
# Swagger: http://localhost:8080/swagger
# SQL (optional host access): localhost,1433  sa / OvetimeDocker_1!

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "OvetimeDocker_1!"
    ports:
      - "1433:1433"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ApplyDatabaseMigrationsOnStartup: "true"
      ConnectionStrings__CommandDb_ConnectionString: "Server=sqlserver;Database=OvetimePolicies1Db;User Id=sa;Password=OvetimeDocker_1!;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      ConnectionStrings__QueryDb_ConnectionString: "Server=sqlserver;Database=OvetimePolicies1Db;User Id=sa;Password=OvetimeDocker_1!;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      ParrotTranslator__ConnectionString: "Server=sqlserver;Database=OvetimePolicies1Db;User Id=sa;Password=OvetimeDocker_1!;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      PollingPublisherSqlStore__ConnectionString: "Server=sqlserver;Database=OvetimePolicies1Db;User Id=sa;Password=OvetimeDocker_1!;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      MessageInboxSqlStore__ConnectionString: "Server=sqlserver;Database=OvetimePolicies1Db;User Id=sa;Password=OvetimeDocker_1!;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
    depends_on:
      - sqlserver
